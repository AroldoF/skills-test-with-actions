name: AI Code Smell Review

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}

          git diff \
            origin/${{ github.base_ref }}...HEAD \
            > diff.txt

      - name: Analyze with GitHub Models
        id: analysis
        uses: github/models-action@v1
        with:
          model: openai/gpt-4.1
          prompt: |
            Você é um especialista em Clean Code.

            Analise o código abaixo e procure:

            - Long Method
            - Duplicated Code

            Para cada problema encontrado:
            - Explique o problema
            - Informe o trecho afetado
            - Sugira uma refatoração

            Código:

            ${{ steps.diff.outputs.content }}

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${{ steps.analysis.outputs.response }}`
            })
